$kind: http-request
url: "{{baseUrl}}/api/docente/casos/{{casoEstadoId}}/despublicar"
method: POST
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("vuelve a borrador", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().estado).to.eql("BORRADOR");
      });
    language: text/javascript
order: 14000
