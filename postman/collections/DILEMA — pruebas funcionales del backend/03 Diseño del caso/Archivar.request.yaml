$kind: http-request
url: "{{baseUrl}}/api/docente/casos/{{casoEstadoId}}/archivar"
method: POST
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("queda archivado", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().estado).to.eql("ARCHIVADO");
      });
    language: text/javascript
order: 16000
