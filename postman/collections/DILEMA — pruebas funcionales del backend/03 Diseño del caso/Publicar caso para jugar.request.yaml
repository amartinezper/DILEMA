$kind: http-request
url: "{{baseUrl}}/api/docente/casos/{{casoId}}/publicar"
method: POST
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("pasa a publicado", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().estado).to.eql("PUBLICADO");
      });
    language: text/javascript
order: 9000
