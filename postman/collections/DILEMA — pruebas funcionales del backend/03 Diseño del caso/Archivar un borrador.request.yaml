$kind: http-request
url: "{{baseUrl}}/api/docente/casos/{{casoId}}/archivar"
method: POST
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 400", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().mensaje).to.eql("RF-09: un borrador no se archiva. Primero se publica.");
      });
    language: text/javascript
order: 8000
