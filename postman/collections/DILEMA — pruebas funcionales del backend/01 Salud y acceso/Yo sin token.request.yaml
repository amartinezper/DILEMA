$kind: http-request
url: "{{baseUrl}}/api/auth/yo"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 401", function () {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().mensaje).to.eql("Inicia sesión para continuar.");
      });
    language: text/javascript
order: 2000
