$kind: http-request
url: "{{baseUrl}}/api/auth/ingresar"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "docente@psicosim.edu",
      "clave": "docente123",
      "codigoAutorizacion": "",
      "rol": "DOCENTE"
    }
scripts:
  - type: afterResponse
    code: |-
      const cuerpo = pm.response.json();
      pm.test("entra el docente como PROFESOR", function () {
        pm.response.to.have.status(200);
        pm.expect(cuerpo.usuario.rol).to.eql("PROFESOR");
        pm.expect(cuerpo.usuario.email).to.eql("docente@psicosim.edu");
        pm.expect(cuerpo.sesionId).to.eql(null);
      });
      pm.collectionVariables.set("tokenDocente", cuerpo.token);
      pm.collectionVariables.set("docenteId", String(cuerpo.usuario.id));
    language: text/javascript
order: 4000
