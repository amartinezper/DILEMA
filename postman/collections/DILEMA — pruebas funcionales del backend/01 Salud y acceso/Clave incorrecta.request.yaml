$kind: http-request
url: "{{baseUrl}}/api/auth/ingresar"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "docente@psicosim.edu",
      "clave": "no-es-la-clave",
      "codigoAutorizacion": "",
      "rol": "DOCENTE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 400", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().mensaje).to.eql("Correo o clave incorrectos.");
      });
    language: text/javascript
order: 5000
