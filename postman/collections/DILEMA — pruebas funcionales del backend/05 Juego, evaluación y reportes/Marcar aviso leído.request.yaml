$kind: http-request
url: "{{baseUrl}}/api/estudiante/avisos/{{avisoId}}/leer"
method: POST
headers:
  Authorization: Bearer {{tokenEstudiante}}
scripts:
  - type: afterResponse
    code: pm.test("responde 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
