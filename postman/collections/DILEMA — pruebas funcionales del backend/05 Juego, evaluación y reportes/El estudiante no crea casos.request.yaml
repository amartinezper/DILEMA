$kind: http-request
url: "{{baseUrl}}/api/docente/casos"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenEstudiante}}
body:
  type: text
  content: '{"nombre":"No debe crearse"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 403", function () {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().mensaje).to.eql("No tienes permiso para esta operación.");
      });
    language: text/javascript
order: 2000
