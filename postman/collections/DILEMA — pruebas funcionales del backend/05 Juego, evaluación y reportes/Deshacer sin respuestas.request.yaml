$kind: http-request
url: "{{baseUrl}}/api/participaciones/{{participacionId}}/deshacer"
method: POST
headers:
  Authorization: Bearer {{tokenEstudiante}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 400", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().mensaje).to.eql("No hay respuestas para deshacer.");
      });
    language: text/javascript
order: 10000
