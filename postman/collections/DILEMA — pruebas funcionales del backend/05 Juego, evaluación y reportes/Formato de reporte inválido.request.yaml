$kind: http-request
url: "{{baseUrl}}/api/docente/sesiones/{{sesionId}}/reporte?formato=doc"
method: GET
headers:
  Authorization: Bearer {{tokenDocente}}
queryParams:
  formato: doc
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 400", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().mensaje).to.eql("RF-16: el formato debe ser pdf, xlsx o csv.");
      });
    language: text/javascript
order: 22000
