$kind: http-request
url: "{{baseUrl}}/api/docente/seguimiento/sesiones/{{sesionId}}/participaciones"
method: GET
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      const lista = pm.response.json();
      pm.test("hay un intento finalizado", function () {
        pm.response.to.have.status(200);
        pm.expect(lista).to.have.lengthOf(1);
        pm.expect(lista[0].id).to.eql(Number(pm.collectionVariables.get("participacionId")));
        pm.expect(lista[0].estado).to.eql("FINALIZADA");
        pm.expect(lista[0].numeroIntento).to.eql(1);
      });
    language: text/javascript
order: 16000
