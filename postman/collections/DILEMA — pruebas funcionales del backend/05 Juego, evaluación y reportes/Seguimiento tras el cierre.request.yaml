$kind: http-request
url: "{{baseUrl}}/api/docente/sesiones/{{sesionId}}/seguimiento"
method: GET
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      const filas = pm.response.json();
      pm.test("el ausente queda AUSENTE con nota 0,0", function () {
        pm.response.to.have.status(200);
        const fila = filas.find(f => f.email === pm.collectionVariables.get("emailAusente"));
        pm.expect(fila).to.be.an("object");
        pm.expect(fila.estado).to.eql("AUSENTE");
        pm.expect(fila.nota).to.eql(0);
        pm.expect(fila.participacionId).to.not.eql(null);
        pm.collectionVariables.set("ausenteParticipacionId", String(fila.participacionId));
      });
      pm.test("el intento que quedó incompleto se cierra con nota parcial", function () {
        const fila = filas.find(f => f.email === pm.collectionVariables.get("emailEstudiante"));
        pm.expect(fila.estado).to.eql("FINALIZADA");
        pm.expect(fila.nota).to.eql(0);
      });
    language: text/javascript
order: 32000
