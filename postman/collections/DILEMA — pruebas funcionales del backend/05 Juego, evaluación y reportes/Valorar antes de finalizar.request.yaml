$kind: http-request
url: "{{baseUrl}}/api/docente/participaciones/{{participacionId}}/retroalimentacion"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenDocente}}
body:
  type: text
  content: '{"texto":"Todavía no."}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 400", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().mensaje).to.eql("RF-26: la valoración general solo se registra cuando la participación finalizó.");
      });
    language: text/javascript
order: 12000
