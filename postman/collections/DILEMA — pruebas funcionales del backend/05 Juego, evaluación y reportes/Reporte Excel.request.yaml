$kind: http-request
url: "{{baseUrl}}/api/docente/sesiones/{{sesionId}}/reporte?formato=xlsx"
method: GET
headers:
  Authorization: Bearer {{tokenDocente}}
queryParams:
  formato: xlsx
scripts:
  - type: afterResponse
    code: |-
      pm.test("Excel descargable", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get("Content-Type")).to.include("spreadsheetml");
        pm.expect(pm.response.headers.get("Content-Disposition")).to.include(".xlsx");
      });
    language: text/javascript
order: 21000
