$kind: http-request
url: "{{baseUrl}}/api/estudiante/panel"
method: GET
headers:
  Authorization: Bearer {{tokenAusente}}
scripts:
  - type: afterResponse
    code: |-
      const panel = pm.response.json();
      pm.test("el ausente recibió el aviso de su nota 0,0 sin leer", function () {
        pm.response.to.have.status(200);
        const aviso = panel.avisos.find(a => a.titulo === "Nota del caso");
        pm.expect(aviso).to.be.an("object");
        pm.expect(aviso.cuerpo).to.match(/0[.,]0/);
        pm.expect(aviso.leida).to.eql(false);
        pm.expect(panel.sinLeer).to.be.at.least(1);
      });
    language: text/javascript
order: 34000
