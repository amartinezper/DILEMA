$kind: http-request
url: "{{baseUrl}}/api/docente/sesiones/{{sesionId}}/finalizar"
method: POST
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 400", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().mensaje).to.eql("RF-19: una sesión finalizada no admite operaciones.");
      });
    language: text/javascript
order: 36000
