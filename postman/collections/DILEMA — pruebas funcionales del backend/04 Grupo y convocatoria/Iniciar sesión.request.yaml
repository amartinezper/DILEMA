$kind: http-request
url: "{{baseUrl}}/api/docente/sesiones/{{sesionId}}/iniciar"
method: POST
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("pasa a en curso", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().estado).to.eql("EN_CURSO");
      });
    language: text/javascript
order: 14000
