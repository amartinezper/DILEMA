$kind: http-request
url: "{{baseUrl}}/api/docente/seguimiento/sesiones/{{sesionId}}/participaciones"
method: GET
headers:
  Authorization: Bearer {{tokenDocente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde 400", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().mensaje).to.eql("RF-15: la sesión no tiene participaciones.");
      });
    language: text/javascript
order: 16000
