$kind: http-request
description: El endpoint existe y responde. Hoy la lista sale vacía.
url: "{{baseUrl}}/api/admin/auditoria"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("responde lista vacía", function () {
